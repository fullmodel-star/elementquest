<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景深邃夜空漸層 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2D1C58"/>
      <stop offset="50%" stop-color="#190F33"/>
      <stop offset="100%" stop-color="#0B0618"/>
    </radialGradient>

    <!-- 金色主光澤漸層 -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0"/>
      <stop offset="35%" stop-color="#F6C844"/>
      <stop offset="70%" stop-color="#D99B16"/>
      <stop offset="100%" stop-color="#8E5D04"/>
    </linearGradient>

    <!-- 寶石紫青漸層 -->
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#38BDF8"/>
      <stop offset="80%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <!-- 劍刃金屬漸層 -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- 聖盾金屬漸層 -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#26174D"/>
      <stop offset="50%" stop-color="#1A0E38"/>
      <stop offset="100%" stop-color="#0E0720"/>
    </linearGradient>

    <!-- 發光濾鏡 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 背景圓盤與多層星環 -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.45"/>

  <!-- 星芒微粒 -->
  <g fill="#FFF" opacity="0.6">
    <circle cx="96" cy="118" r="2.5"/>
    <circle cx="418" cy="132" r="3"/>
    <circle cx="82" cy="380" r="2"/>
    <circle cx="430" cy="392" r="2.5"/>
    <polygon points="256,36 260,46 270,50 260,54 256,64 252,54 242,50 252,46" fill="#FDE047" opacity="0.8"/>
  </g>

  <!-- 電子軌域環 1（青色傾斜 35°） -->
  <g transform="rotate(35 256 256)">
    <ellipse cx="256" cy="256" rx="205" ry="72" fill="none" stroke="#38BDF8" stroke-width="3.5" opacity="0.75" filter="url(#softGlow)"/>
    <circle cx="461" cy="256" r="8" fill="#E0F2FE" filter="url(#softGlow)"/>
    <circle cx="51" cy="256" r="5" fill="#38BDF8"/>
  </g>

  <!-- 電子軌域環 2（金色傾斜 -35°） -->
  <g transform="rotate(-35 256 256)">
    <ellipse cx="256" cy="256" rx="205" ry="72" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" opacity="0.85" filter="url(#softGlow)"/>
    <circle cx="461" cy="256" r="8" fill="#FEF08A" filter="url(#softGlow)"/>
    <circle cx="51" cy="256" r="5" fill="#EAB308"/>
  </g>

  <!-- 電子軌域環 3（紫粉色垂直傾斜 80°） -->
  <g transform="rotate(80 256 256)">
    <ellipse cx="256" cy="256" rx="195" ry="68" fill="none" stroke="#C084FC" stroke-width="2.8" opacity="0.7" stroke-dasharray="14 8"/>
    <circle cx="451" cy="256" r="6" fill="#F472B6"/>
  </g>

  <!-- 中央勇者聖盾主體 -->
  <g filter="url(#glow)">
    <!-- 盾牌外金框 -->
    <path d="M256 92 L368 140 C368 270 318 360 256 406 C194 360 144 270 144 140 Z" 
          fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="9" stroke-linejoin="round"/>
    <!-- 盾面內飾金線 -->
    <path d="M256 112 L350 152 C350 258 308 338 256 380 C204 338 162 258 162 152 Z" 
          fill="none" stroke="#FDE047" stroke-width="2" stroke-opacity="0.45"/>
  </g>

  <!-- 盾牌中央：交錯冒險聖劍 -->
  <g>
    <!-- 劍刃 -->
    <polygon points="256,128 266,160 263,310 256,334 249,310 246,160" fill="url(#bladeGrad)"/>
    <line x1="256" y1="134" x2="256" y2="330" stroke="#CBD5E1" stroke-width="1.8"/>
    <!-- 劍格橫手 -->
    <path d="M224 308 Q256 316 288 308 L284 318 Q256 324 228 318 Z" fill="url(#goldGrad)"/>
    <!-- 劍柄與劍首寶石 -->
    <rect x="252" y="318" width="8" height="28" rx="2" fill="#92400E"/>
    <circle cx="256" cy="352" r="7" fill="url(#goldGrad)"/>
    <circle cx="256" cy="352" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- 盾牌核心：六角元素能量晶石 -->
  <g transform="translate(0, -26)">
    <!-- 核心光芒環 -->
    <circle cx="256" cy="242" r="46" fill="#A855F7" opacity="0.25" filter="url(#glow)"/>
    <!-- 外圈金色六芒星 -->
    <polygon points="256,206 287,224 287,260 256,278 225,260 225,224" 
             fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <!-- 內部水晶面 -->
    <polygon points="256,212 282,227 282,257 256,272 230,257 230,227" 
             fill="url(#gemGrad)"/>
    <!-- 水晶高光切割線 -->
    <polygon points="256,212 282,227 256,242" fill="#FFFFFF" opacity="0.4"/>
    <polygon points="230,227 256,212 256,242" fill="#FFFFFF" opacity="0.6"/>
    <polygon points="230,257 230,227 256,242" fill="#0284C7" opacity="0.35"/>
    
    <!-- 核心文字「EQ」微刻 -->
    <text x="256" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" 
          fill="#FFFFFF" text-anchor="middle" letter-spacing="1" filter="url(#softGlow)">EQ</text>
  </g>

  <!-- 頂部與底部尊榮星月徽印 -->
  <polygon points="256,98 261,109 272,112 263,119 266,130 256,124 246,130 249,119 240,112 251,109" fill="url(#goldGrad)"/>
  <circle cx="256" cy="428" r="4.5" fill="url(#goldGrad)"/>
  <circle cx="236" cy="428" r="3" fill="url(#goldGrad)" opacity="0.6"/>
  <circle cx="276" cy="428" r="3" fill="url(#goldGrad)" opacity="0.6"/>
</svg>
